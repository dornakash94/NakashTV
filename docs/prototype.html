<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakashTV — פרוטוטייפ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C; --s1:#15161A; --s2:#1F2127; --s3:#2A2D35;
  --tx:#F4F4F5; --mu:#9A9CA5; --dim:#5E616B;
  --ac:#F0B441; --ac2:#B8801C; --live:#E3453A; --ok:#4CC38A;
  --tile:#1D1E23;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#000;overflow:hidden;position:fixed;inset:0;font-family:Heebo,"Segoe UI",Arial,sans-serif;color:var(--tx)}
body{display:flex;align-items:center;justify-content:center}
#tv{width:1920px;height:1080px;position:relative;background:var(--bg);overflow:hidden;flex:none;outline:none}
#stage{position:absolute;inset:0}
.screen{position:absolute;inset:0;padding:56px 140px 40px 72px;overflow:hidden}
/* nav */
#nav{position:absolute;top:0;right:0;bottom:0;width:80px;background:transparent;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 14px;z-index:20;transition:width .2s}
#nav.open{width:300px;background:linear-gradient(to left,#0A0A0C 55%,rgba(10,10,12,0))}
#nav .brand{position:absolute;top:52px;right:28px;font-weight:800;font-size:26px;letter-spacing:-.5px;white-space:nowrap}
#nav .brand b{color:var(--ac)}
#nav .brand small{display:block;font-weight:400;font-size:13px;color:var(--dim);letter-spacing:0;margin-top:2px}
.ni{display:flex;align-items:center;gap:18px;height:52px;border-radius:12px;padding:0 12px;color:var(--mu);font-size:22px;font-weight:500;white-space:nowrap;overflow:hidden}
.ni svg{width:28px;height:28px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ni span{opacity:0;transition:opacity .15s}
#nav.open .ni span{opacity:1}
.ni.active{color:var(--tx)}
.ni.focus{background:var(--tx);color:#000}
/* rows */
.rows{position:absolute;left:40px;right:108px;bottom:0;top:520px;padding:0 32px 0 32px;overflow:hidden;z-index:3}
.rows .row:first-child{padding-top:14px}
.row{margin-bottom:34px;transition:transform .25s}
.row h3{font-size:24px;font-weight:600;color:var(--tx);margin-bottom:14px;padding-right:6px}
.row h3 small{font-weight:400;color:var(--dim);font-size:18px;margin-right:10px}
.track{display:flex;gap:16px;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.card{flex:none;border-radius:10px;background:var(--tile);position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,opacity .2s;transform-origin:center}
.card.focus{transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 18px 40px rgba(0,0,0,.6);z-index:2}
.track.dimmed .card:not(.focus){opacity:.85}
.poster{width:200px;height:300px}
.wide{width:320px;height:180px}
.poster .ph,.wide .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:16px;text-align:center}
.ph .mono{font-weight:800;font-size:56px;line-height:1;letter-spacing:-2px}
.ph .t{font-size:18px;font-weight:500;color:var(--tx)}
.ph .y{font-size:15px;color:var(--mu)}
.card .lbl{position:absolute;left:0;right:0;bottom:0;padding:44px 12px 12px;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,0));font-size:16px;font-weight:500;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focus .lbl{opacity:1}
.card .prog{position:absolute;left:10px;right:10px;bottom:8px;height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.card .prog i{display:block;height:100%;background:var(--tx)}
.card.vod .prog i{background:var(--live)}
/* channel card */
.chc{display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.chc .logo{display:flex;align-items:center;gap:12px}
.logo .sq{width:64px;height:64px;border-radius:12px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;flex:none}
.logo .nm{font-size:20px;font-weight:600;line-height:1.15}
.logo .num{font-size:14px;color:var(--mu);font-weight:500}
.chc .now{font-size:17px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chc .now b{color:var(--tx);font-weight:500}
.chc .tags{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.12);color:var(--tx)}
.tag.ac{background:var(--ac);color:#000}
.tag.live{background:var(--live);color:#fff}
/* hero */
#hero{position:absolute;inset:0 0 auto 0;height:640px;pointer-events:none;z-index:1}
#hero .bd{position:absolute;inset:0;animation:heroin .5s ease-out}
#hero .prev{position:absolute;inset:0;overflow:hidden;animation:heroin .5s ease-out}
#hero .fade{position:absolute;inset:0;z-index:1;background:linear-gradient(to left,var(--bg) 0%,rgba(10,10,12,.96) 26%,rgba(10,10,12,.72) 44%,rgba(10,10,12,.18) 64%,rgba(10,10,12,0) 100%),linear-gradient(to top,var(--bg) 0%,rgba(10,10,12,.6) 18%,rgba(10,10,12,0) 48%)}
#hero .prev .sig{position:absolute;inset:-8%;animation:drift 12s ease-in-out infinite alternate}
#hero .lab{z-index:2;position:absolute;left:32px;bottom:120px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mu);background:rgba(0,0,0,.45);padding:6px 12px;border-radius:8px}
#hero .lab .dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
#hero .mute{z-index:2;position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:var(--tx)}
#hero .mute svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

@keyframes heroin{from{opacity:0}to{opacity:1}}
#hero .txt{animation:heroin .35s ease-out;z-index:2;position:absolute;top:120px;right:140px;width:760px;transition:opacity .3s}
#hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ac);margin-bottom:14px}
#hero .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#hero h1{font-size:60px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-bottom:14px}
#hero .meta{font-size:20px;color:var(--mu);margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#hero .meta .star{color:var(--ac);font-weight:600}
#hero p{font-size:21px;line-height:1.5;color:#D3D4D8;max-width:680px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#hero .btns{display:flex;gap:12px;margin-top:22px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;padding:0 26px;height:52px;border-radius:8px;font-size:20px;font-weight:600;background:rgba(255,255,255,.14);color:var(--tx)}
.btn.pri{background:var(--tx);color:#000}
.btn svg{width:22px;height:22px;fill:currentColor}
.hprog{width:420px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:14px;overflow:hidden}
.hprog i{display:block;height:100%;background:var(--ac)}
/* two-pane (channels) */
.pane{position:absolute;top:56px;bottom:40px;right:140px;width:360px}
.pane h2{font-size:34px;font-weight:800;margin-bottom:22px}
.cat{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-radius:10px;font-size:21px;color:var(--mu);font-weight:500}
.cat small{color:var(--dim);font-size:16px}
.cat.active{color:var(--tx);background:var(--s1)}
.cat.focus{background:var(--tx);color:#000}
.cat.focus small{color:#333}
.grid{position:absolute;top:40px;bottom:0;right:510px;left:40px;padding:16px 30px 0 32px;overflow:hidden}
.grid .gtrack{display:grid;grid-template-columns:repeat(auto-fill,300px);gap:16px;justify-content:start;transition:transform .25s}
.grid .card{width:300px;height:170px}
/* guide */
.guide{position:absolute;top:56px;bottom:40px;right:140px;left:72px}
.guide .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.guide h2{font-size:34px;font-weight:800}
.guide .day{color:var(--mu);font-size:20px}
.gtime{display:flex;height:34px;margin-right:260px;position:relative;color:var(--mu);font-size:16px;font-weight:500;border-bottom:1px solid var(--s2)}
.gtime span{width:360px;flex:none;padding-right:8px}
.grows{position:relative;overflow:hidden;height:600px;transition:transform .25s}
.grow{display:flex;height:84px;margin-bottom:8px}
.grow .gch{width:260px;flex:none;display:flex;align-items:center;gap:12px;padding-right:6px}
.grow .gch .sq{width:56px;height:56px;font-size:19px}
.grow .gch .nm{font-size:18px}
.gprogs{position:relative;flex:1;overflow:hidden}
.gp{position:absolute;top:0;height:84px;background:var(--s1);border-radius:8px;padding:12px 14px;overflow:hidden;border:2px solid transparent}
.gp .pt{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp .ps{font-size:14px;color:var(--mu);margin-top:6px;display:flex;gap:8px;align-items:center}
.gp.past{background:#111216;color:var(--mu)}
.gp.filler{background:repeating-linear-gradient(135deg,#131418,#131418 8px,#17181d 8px,#17181d 16px);color:var(--dim)}
.gp.tiny .pt,.gp.tiny .ps{display:none}
.gp.focus{border-color:#fff;background:var(--s3);color:var(--tx)}
.gp.focus .ps{color:#D3D4D8}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);z-index:3;box-shadow:0 0 12px var(--ac)}
.ginfo{position:absolute;bottom:0;right:0;left:0;height:140px;background:var(--s1);border-radius:14px;padding:22px 26px;display:flex;gap:26px;align-items:flex-start}
.ginfo .sq{width:80px;height:80px;font-size:26px}
.ginfo h4{font-size:26px;font-weight:700;margin-bottom:6px}
.ginfo .m{color:var(--mu);font-size:17px;margin-bottom:8px}
.ginfo p{font-size:18px;color:#D3D4D8;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* detail */
.detail{position:absolute;inset:0}
.detail .bd{position:absolute;inset:0}
.detail .bd:after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(10,10,12,.95) 0%,rgba(10,10,12,.7) 45%,rgba(10,10,12,.15) 100%),linear-gradient(to top,var(--bg) 0%,rgba(10,10,12,0) 50%)}
.detail .txt{position:absolute;top:110px;right:140px;width:820px}
.detail h1{font-size:58px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-bottom:12px}
.detail .meta{font-size:20px;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.detail p{font-size:21px;line-height:1.5;color:#D3D4D8;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.detail .cast{font-size:17px;color:var(--mu);margin-bottom:22px}
.detail .cast b{color:#D3D4D8;font-weight:500}
.detail .btns{display:flex;gap:12px}
.btn.focus{box-shadow:0 0 0 3px #fff;background:var(--ac);color:#000}
.detail .rows{top:620px}
/* seasons */
.seasons{display:flex;gap:10px;margin-bottom:16px}
.seas{padding:0 20px;height:46px;display:flex;align-items:center;gap:10px;border-radius:23px;background:var(--s1);color:var(--mu);font-size:19px;font-weight:500}
.seas small{color:var(--dim);font-size:15px}
.seas.active{color:var(--tx);background:var(--s2)}
.seas.focus{background:var(--tx);color:#000}
.seas.focus small{color:#333}
.eps{position:absolute;top:640px;bottom:40px;right:140px;left:72px;overflow:hidden}
.eplist{transition:transform .25s}
.ep{display:flex;gap:18px;align-items:center;height:96px;margin-bottom:10px;border-radius:12px;padding:8px 12px;background:var(--s1);border:2px solid transparent}
.ep.focus{border-color:#fff;background:var(--s2)}
.ep .th{width:144px;height:80px;border-radius:8px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:var(--mu);flex:none;position:relative;overflow:hidden}
.ep .th .prog{left:6px;right:6px;bottom:5px}
.ep .in{flex:1}
.ep .in b{font-size:21px;font-weight:600;display:block}
.ep .in span{color:var(--mu);font-size:16px}
.ep .chk{color:var(--ok);font-size:24px;width:32px;text-align:center}
.jump{position:absolute;top:24px;left:80px;background:var(--s2);border:2px solid var(--ac);border-radius:14px;padding:20px 30px;font-size:30px;font-weight:700;z-index:5;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.jump small{display:block;font-size:15px;color:var(--mu);font-weight:400;margin-top:4px}
/* player */
#player{position:absolute;inset:0;background:#000}
#video{position:absolute;inset:0;overflow:hidden}
#video .sig{position:absolute;inset:-10%;background:radial-gradient(60% 50% at 30% 40%,rgba(240,180,65,.14),transparent 60%),radial-gradient(50% 60% at 75% 65%,rgba(70,90,160,.18),transparent 60%),linear-gradient(180deg,#0f1015,#05050a);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,2%) scale(1.06)}}
#video .nosig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim);font-size:18px}
#video .nosig b{font-size:26px;color:var(--mu);font-weight:600}
.pov{position:absolute;inset:0;transition:opacity .3s}
.pov.hidden{opacity:0}
.pov .top{position:absolute;top:0;left:0;right:0;height:220px;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent)}
.pov .bot{position:absolute;bottom:0;left:0;right:0;height:360px;background:linear-gradient(to top,rgba(0,0,0,.92),transparent)}
.pinfo{position:absolute;top:60px;right:80px;display:flex;align-items:center;gap:18px}
.pinfo .sq{width:84px;height:84px;font-size:26px;border-radius:14px}
.pinfo .n{font-size:32px;font-weight:700}
.pinfo .num{color:var(--mu);font-size:20px}
.pnow{position:absolute;bottom:200px;right:80px;left:80px}
.pnow .t{font-size:34px;font-weight:700;margin-bottom:8px}
.pnow .d{color:#D3D4D8;font-size:19px;max-width:900px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{position:absolute;bottom:150px;right:80px;left:80px;height:6px;background:rgba(255,255,255,.25);border-radius:3px}
.pbar i{display:block;height:100%;background:var(--tx);border-radius:3px}
.pbar.vod i{background:var(--live)}
.pbar .knob{position:absolute;top:-7px;width:20px;height:20px;border-radius:50%;background:#fff;transform:translateX(50%)}
.ptimes{position:absolute;bottom:112px;right:80px;left:80px;display:flex;justify-content:space-between;color:var(--mu);font-size:17px;font-weight:500}
.hint{position:absolute;bottom:48px;right:80px;left:80px;display:flex;gap:26px;color:var(--mu);font-size:16px;align-items:center}
.hint .k{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;border-radius:6px;background:rgba(255,255,255,.15);color:var(--tx);padding:0 8px;font-weight:600;font-size:14px;margin-left:8px}
.hint .c{width:14px;height:14px;border-radius:50%;display:inline-block;margin-left:8px}
/* scrub strip */
.strip{position:absolute;bottom:180px;right:80px;left:80px;height:150px;display:flex;align-items:flex-end;justify-content:center;gap:10px;pointer-events:none}
.fr{width:170px;height:96px;border-radius:8px;background:#222;flex:none;opacity:.55;transform:scale(.9);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 4px #000;transition:transform .12s,opacity .12s}
.fr.c{opacity:1;transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 12px 30px rgba(0,0,0,.6);width:220px;height:124px;font-size:18px}
.mini{position:absolute;bottom:130px;right:80px;left:80px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:16px;align-items:center;height:80px;border-radius:12px;background:rgba(20,21,26,.9);padding:8px 14px;border:2px solid transparent}
.mrow.cur{border-color:var(--ac)}
.mrow.focus{border-color:#fff;background:rgba(42,45,53,.95)}
.mrow .sq{width:60px;height:60px;font-size:20px}
.mrow .nm{width:260px;font-size:20px;font-weight:600}
.mrow .pr{flex:1;font-size:18px}
.mrow .pr b{font-weight:500}
.mrow .pr span{color:var(--mu);margin-right:14px}
.mrow .nx{width:340px;color:var(--mu);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;top:60px;left:80px;background:rgba(20,21,26,.95);border:1px solid var(--s3);border-radius:12px;padding:14px 20px;font-size:18px;display:flex;gap:10px;align-items:center;transition:opacity .3s}
.toast .c{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.zap{position:absolute;top:60px;right:80px;background:rgba(0,0,0,.7);border-radius:16px;padding:20px 28px;font-size:44px;font-weight:800;letter-spacing:2px;display:flex;gap:20px;align-items:center}
/* settings/search */
.list{width:760px}
.li{display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 22px;border-radius:12px;font-size:21px;color:var(--tx);border:2px solid transparent}
.li span{color:var(--mu);font-size:18px}
.li.focus{background:var(--s2);border-color:#fff}
.li.h{color:var(--mu);font-size:17px;height:44px;margin-top:14px;font-weight:600}
.kbd{display:grid;grid-template-columns:repeat(9,68px);gap:8px;margin-top:16px;width:680px}
.key{height:60px;border-radius:8px;background:var(--s1);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500}
.key.focus{background:var(--tx);color:#000}
.key.w{grid-column:span 3}
.sbox{height:72px;border-radius:12px;background:var(--s1);display:flex;align-items:center;padding:0 24px;font-size:28px;margin-top:24px;width:680px;color:var(--mu)}
.sbox b{color:var(--tx);font-weight:500}
.sbox .cur{width:2px;height:34px;background:var(--ac);margin-right:4px;animation:pulse 1s infinite}
.results{position:absolute;top:56px;left:72px;right:940px;bottom:40px;overflow:hidden}
.results .row h3{font-size:20px}
/* banner */
.banner{position:absolute;top:22px;right:140px;left:72px;height:40px;display:flex;align-items:center;gap:12px;color:var(--mu);font-size:16px;z-index:5}
.banner .c{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.badge{position:absolute;bottom:14px;left:24px;font-size:13px;color:var(--dim);z-index:30}
.remote{position:absolute;bottom:14px;right:24px;display:flex;gap:14px;font-size:13px;color:var(--dim);z-index:30}
.remote b{color:var(--mu);font-weight:600}
.dpad{position:absolute;left:24px;bottom:44px;z-index:40;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;opacity:.55;transition:opacity .2s}
.dpad:hover{opacity:1}
.dpad button{border:0;border-radius:12px;background:rgba(255,255,255,.12);color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;font-family:inherit}
.dpad button:active{background:var(--ac);color:#000}
.dpad .ok{background:rgba(255,255,255,.22);font-size:15px}
.dpad .bk{grid-column:3;grid-row:3;font-size:14px}
.card,.ni,.cat,.gp,.ep,.seas,.key,.li,.mrow,.btn{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="tv">
  <div id="stage"></div>
  <nav id="nav">

// ===== PLAYER =====
function openPlayer(p){S.stack.push({screen:S.screen,params:S.params,focus:S.focus});S.screen='player';S.player={...p,ov:true,mini:false,scrub:null,src:0,t:0};
 if(p.movie){S.player.total=p.movie.d*60||3600;S.player.t=Math.round(S.player.total*(p.from||0))}
 if(p.series){S.player.total=p.ep.dur;S.player.t=Math.round(p.ep.dur*p.ep.pos)}
 if(p.list)S.player.list=p.list;else if(p.ch)S.player.list=CHANNELS;
 render();hideOv();tick();}
function closePlayer(){clearTimeout(S.ovT);clearInterval(S.tickT);const prev=S.stack.pop();S.screen=prev.screen;S.params=prev.params;S.focus=prev.focus||{};S.player=null;render()}
function hideOv(){clearTimeout(S.ovT);S.ovT=setTimeout(()=>{if(S.player&&!S.player.mini&&!S.player.scrub&&!S.menu){S.player.ov=false;const o=stage.querySelector('.pov');o&&o.classList.add('hidden')}},4000)}
function showOv(){if(!S.player)return;S.player.ov=true;hideOv();}
function tick(){clearInterval(S.tickT);S.tickT=setInterval(()=>{const p=S.player;if(!p)return;if((p.movie||p.series)&&!p.scrub&&!p.paused){p.t=Math.min(p.total,p.t+1);const el=stage.querySelector('.pbar i');if(el)el.style.width=(p.t/p.total*100)+'%';const k=stage.querySelector('.pbar .knob');if(k)k.style.right=(p.t/p.total*100)+'%';const tm=stage.querySelector('.ptimes .l');if(tm)tm.textContent=secs(p.t);const rem=stage.querySelector('.ptimes .r');if(rem)rem.textContent='-'+secs(p.total-p.t)}},1000)}
function secs(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function frameStyle(hueBase,t,total){const h=(hueBase+t/total*140)%360;return `background:linear-gradient(${120+t/total*90}deg,hsl(${h} 35% ${18+Math.sin(t/37)*8}%),hsl(${(h+60)%360} 30% ${10+Math.cos(t/23)*5}%))`}
SCREENS.player={
 render(){const p=S.player;let html=`<div id="player"><div id="video"><div class="sig"></div><div class="nosig"><b>${p.ch?p.ch.n:p.movie?p.movie.t:p.series.t}</b><span>הווידאו לא מנוגן בפרוטוטייפ — בדפדפן אין גישה לסטרים מהשרת. באפליקציה: ExoPlayer, HLS/mp4.</span></div></div>`;
  if(p.ch){const c=p.ch;const cur=p.archive||nowProg(c);const fill=isFiller(c,cur);const nx=nextProg(c);const pct=cur&&!fill?(p.archive?0.3:(nowMin()-cur.s)/(cur.e-cur.s)):0;const srcs=['ראשי','גיבוי 1','גיבוי 2','גיבוי 3'].slice(0,c.alt.length+1);
   html+=`<div class="pov ${p.ov?'':'hidden'}"><div class="top"></div><div class="bot"></div><div class="pinfo">${sq(c)}<div><div class="n">${c.n}</div><div class="num">ערוץ ${c.num}${p.archive?' · <span style="color:var(--ac)">מהארכיון</span>':' · <span style="color:var(--live)">● שידור חי</span>'}${c.alt.length?` · מקור: ${srcs[p.src]}`:''}</div></div></div>
   ${!p.mini?`<div class="pnow"><div class="t">${cur&&!fill?cur.t:''}</div><div class="d">${cur&&!fill?cur.d:''}</div></div>${cur&&!fill?`<div class="pbar"><i style="width:${pct*100}%"></i></div><div class="ptimes"><span>${fmt(cur.s)}${c.arc?' · <span style="color:var(--ac)">◀ מהתחלה</span>':''}</span><span>${nx?`הבא: ${nx.t} · ${fmt(nx.s)}`:''}</span><span>${fmt(cur.e)}</span></div>`:''}`:''}
   ${p.mini?`<div class="mini">${this.miniRows().map((x,i)=>{const q=nowProg(x);const f2=isFiller(x,q);const n2=nextProg(x);return `<div class="mrow ${x.id===c.id?'cur':''} ${i===p.miniIdx?'focus':''}">${sq(x)}<div class="nm">${x.n}<div style="font-size:14px;color:var(--mu);font-weight:400">ערוץ ${x.num}</div></div><div class="pr">${q&&!f2?`<b>${q.t}</b><span>${rng(q.s,q.e)}</span>`:'<span>ללא לוח</span>'}</div><div class="nx">${n2&&!f2?`הבא: ${n2.t}`:''}</div></div>`}).join('')}</div>`:''}
   <div class="hint"><span><span class="k">▲▼</span>זפזופ</span><span><span class="k">OK</span>מיני־EPG</span><span><span class="k">◀▶</span>${c.arc?'ארכיון / מהתחלה':'—'}</span><span><span class="k">0–9</span>מספר ערוץ</span><span><span class="c" style="background:var(--live)"></span>מועדף</span><span><span class="c" style="background:var(--ok)"></span>מקור</span><span><span class="c" style="background:var(--ac)"></span>כתוביות</span><span><span class="c" style="background:#4a7fe0"></span>לוח שידורים</span></div></div>`;
   if(S.digits)html+=`<div class="zap">${S.digits}<span style="font-size:18px;font-weight:400;color:var(--mu)">${byId[CHANNELS[+S.digits-1]?.id]?.n||''}</span></div>`;
  } else {
   const isM=!!p.movie;const title=isM?p.movie.t:p.series.t;const sub=isM?[p.movie.y,p.movie.g].filter(Boolean).join(' · '):`עונה ${p.ep.s} פרק ${p.ep.e}`;const hueB=isM?p.movie.hue:p.series.hue;const pos=p.scrub!=null?p.scrub:p.t;
   const frames=[];if(p.scrub!=null){for(let i=-2;i<=2;i++){const t=Math.max(0,Math.min(p.total,pos+i*10));frames.push(`<div class="fr ${i===0?'c':''}" style="${frameStyle(hueB,t,p.total)}">${secs(t)}</div>`)}}
   html+=`<div class="pov ${p.ov?'':'hidden'}"><div class="top"></div><div class="bot"></div><div class="pinfo"><div><div class="n">${title}</div><div class="num">${sub}${p.paused?' · <span style="color:var(--ac)">מושהה</span>':''}</div></div></div>
   ${p.scrub!=null?`<div class="strip">${frames.join('')}</div>`:''}
   <div class="pbar vod"><i style="width:${pos/p.total*100}%"></i><div class="knob" style="right:${pos/p.total*100}%"></div></div><div class="ptimes"><span class="l">${secs(pos)}</span><span>${p.scrub!=null?'<span style="color:var(--ac)">גרירה — תמונות מהסרט (דמו: פריימים נוצרים במכשיר כל 10 שניות)</span>':''}</span><span class="r" dir="ltr">-${secs(p.total-pos)}</span></div>
   <div class="hint"><span><span class="k">OK</span>${p.paused?'המשך':'השהה'}</span><span><span class="k">◀▶</span>10 שניות · לחיצה ארוכה מאיצה</span><span><span class="k">▼</span>אודיו · כתוביות · מהירות</span>${p.series?'<span><span class="k">▲</span>פרקים</span>':''}<span><span class="k">↩</span>יציאה — הפוזיציה נשמרת</span></div></div>`;
  }
  html+=`</div>`;stage.innerHTML=html;if(S.toast)showToastEl();},
 miniRows(){const p=S.player;const list=p.list||CHANNELS;const i=list.findIndex(c=>c.id===p.ch.id);return [list[i],list[(i+1)%list.length],list[(i+2)%list.length]]},
 key(k){const p=S.player;showOv();
  if(p.ch){const list=p.list||CHANNELS;const i=list.findIndex(c=>c.id===p.ch.id);
   if(p.mini){if(k==='ArrowDown')p.miniIdx=Math.min(2,(p.miniIdx||0)+1);else if(k==='ArrowUp')p.miniIdx=Math.max(0,(p.miniIdx||0)-1);else if(k==='Enter'){const rows=this.miniRows();p.ch=rows[p.miniIdx||0];p.mini=false;p.archive=null;p.src=0}else if(k==='Backspace'||k==='Escape'){p.mini=false}else if(k==='ArrowLeft'||k==='ArrowRight'){/* scroll mini without changing */const d=k==='ArrowLeft'?1:-1;p.ch=list[(i+d+list.length)%list.length];p.archive=null;p.src=0}this.render();return}
   if(k==='ArrowUp'){p.ch=list[(i+1)%list.length];p.archive=null;p.src=0}
   else if(k==='ArrowDown'){p.ch=list[(i-1+list.length)%list.length];p.archive=null;p.src=0}
   else if(k==='Enter'){p.mini=true;p.miniIdx=0}
   else if(k==='ArrowRight'&&p.ch.arc){const cur=nowProg(p.ch);if(cur&&!isFiller(p.ch,cur)){p.archive=cur;toast('מנגן מההתחלה — timeshift.php')}}
   else if(k==='ArrowLeft'&&p.archive){p.archive=null;toast('חזרה לשידור החי')}
   else if(k==='g'||k==='G'){p.src=(p.src+1)%(p.ch.alt.length+1);toast(p.src?`עברנו ל${['','גיבוי 1','גיבוי 2','גיבוי 3'][p.src]} (stream ${p.ch.alt[p.src-1]})`:'מקור ראשי')}
   else if(k==='f'||k==='F')toast('failover: הסטרים הראשי נפל → גיבוי 1, בשקט');
   this.render();return}
  // VOD
  if(k==='Enter'){if(p.scrub!=null){p.t=p.scrub;p.scrub=null;toast(`קפיצה ל־${secs(p.t)}`)}else p.paused=!p.paused}
  else if(k==='ArrowLeft'){p.scrub=Math.min(p.total,(p.scrub??p.t)+10);clearTimeout(p.scrubT);p.scrubT=setTimeout(()=>{if(S.player===p&&p.scrub!=null){p.t=p.scrub;p.scrub=null;this.render()}},1800)}
  else if(k==='ArrowRight'){p.scrub=Math.max(0,(p.scrub??p.t)-10);clearTimeout(p.scrubT);p.scrubT=setTimeout(()=>{if(S.player===p&&p.scrub!=null){p.t=p.scrub;p.scrub=null;this.render()}},1800)}
  else if(k==='ArrowDown')toast('פאנל אודיו/כתוביות/מהירות — בגרסה המלאה');
  else if(k==='ArrowUp'&&p.series)toast('רשימת פרקי העונה ב־PiP — בגרסה המלאה');
  this.render();}
};
function toast(msg){S.toast=msg;clearTimeout(S.toastT);showToastEl();S.toastT=setTimeout(()=>{S.toast=null;const t=stage.querySelector('.toast');t&&t.remove()},2500)}
function showToastEl(){let t=stage.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';(stage.querySelector('#player')||stage).appendChild(t)}t.innerHTML=`<span class="c"></span>${S.toast}`}

// ===== input =====
function press(k){
  
  if(S.screen==='player'){if(k==='Backspace'||k==='Escape'){if(S.player.mini){S.player.mini=false;SCREENS.player.render();return}closePlayer();return}
    if(/^[0-9]$/.test(k)&&S.player.ch){S.digits=(S.digits+k).slice(-3);clearTimeout(S.digitTimer);S.digitTimer=setTimeout(()=>{const c=CHANNELS[+S.digits-1];S.digits='';if(!S.player)return;if(c){S.player.ch=c;S.player.archive=null;S.player.src=0}SCREENS.player.render()},1200);SCREENS.player.render();return}
    SCREENS.player.key(k);return}
  if(k==='Backspace'||k==='Escape'){if(S.nav){S.nav=false;render();return}if(S.screen==='search'&&S.q){SCREENS.search.key('Backspace');return}if(S.screen==='home'){toast('לחיצה נוספת תסגור את האפליקציה');return}back();return}
  if(S.nav){if(k==='ArrowDown')S.navIdx=Math.min(NAV.length-1,S.navIdx+1);else if(k==='ArrowUp')S.navIdx=Math.max(0,S.navIdx-1);else if(k==='ArrowLeft'){S.nav=false}else if(k==='Enter'){const target=NAV[S.navIdx][0];S.nav=false;if(target!==S.screen){S.stack=[];S.screen=target;S.params={};S.focus={}}}render();return}
  if(/^[0-9]$/.test(k)){S.digits=(S.digits+k).slice(-3);clearTimeout(S.digitTimer);
    if(S.screen==='seriesDetail'&&S.focus.area==='eps'){SCREENS.seriesDetail.render();S.digitTimer=setTimeout(()=>{S.digits='';if(S.screen==='seriesDetail')SCREENS.seriesDetail.render()},4000);return}
    S.digitTimer=setTimeout(()=>{const c=CHANNELS[+S.digits-1];S.digits='';if(c)openPlayer({ch:c})},1200);toast(`ערוץ ${S.digits}…`);return}
  if(k==='m'||k==='M'){toast('תפריט הקשר (לחיצה ארוכה ברימוט): מועדפים · הסתר · בחר מקור');return}
  const sc=SCREENS[S.screen];if(sc&&sc.key)sc.key(k);
}
const ALT={a:'ArrowRight',d:'ArrowLeft',w:'ArrowUp',s:'ArrowDown',A:'ArrowRight',D:'ArrowLeft',W:'ArrowUp',S:'ArrowDown'};
window.addEventListener('keydown',e=>{
  let k=e.key; if(e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp'||e.code==='ArrowDown')k=e.code;
  if(ALT[k]&&S.screen!=='search')k=ALT[k];
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Backspace','Escape','PageUp','PageDown',' '].includes(k))e.preventDefault();
  press(k);
},true);
document.querySelector('.dpad').addEventListener('click',e=>{const b=e.target.closest('button');if(b){press(b.dataset.k);document.body.focus()}});
// mouse / touch on content
function locate(el){
  const card=el.closest('.rows .card');if(card){const row=card.closest('.row');const r=+row.dataset.r;const c=[...row.querySelectorAll('.card')].indexOf(card);return {kind:'row',r,c}}
  const g=el.closest('.grid .card');if(g){return {kind:'grid',i:[...stage.querySelectorAll('.grid .card')].indexOf(g)}}
  const cat=el.closest('.cat');if(cat){return {kind:'cat',i:[...stage.querySelectorAll('.cat')].indexOf(cat)}}
  const ni=el.closest('.ni');if(ni){return {kind:'nav',i:[...nav.querySelectorAll('.ni')].indexOf(ni)}}
  const ep=el.closest('.ep');if(ep){return {kind:'ep',i:[...stage.querySelectorAll('.ep')].indexOf(ep)}}
  const seas=el.closest('.seas');if(seas){return {kind:'seas',i:[...stage.querySelectorAll('.seas')].indexOf(seas)}}
  const mr=el.closest('.mrow');if(mr){return {kind:'mrow',i:[...stage.querySelectorAll('.mrow')].indexOf(mr)}}
  const btn=el.closest('.detail .btn');if(btn){return {kind:'btn',i:[...stage.querySelectorAll('.detail .btns .btn')].indexOf(btn)}}
  return null;
}
function applyPointer(loc,select){
  const f=S.focus;
  if(loc.kind==='row'){S.nav=false;f.r=loc.r;f.c=loc.c;if(f.row!==undefined)f.row=0;if(stage.querySelector('.rows')&&SCREENS[S.screen].rows){applyRowFocus();renderNav();const rows=SCREENS[S.screen].rows();if(stage.querySelector('#hero'))softHero(heroFor(S.screen==='home'?rows[f.r]:{key:S.screen==='movies'?'new':'eps'},rows[f.r].items[f.c]))}else render();if(select)press('Enter');return}
  if(loc.kind==='grid'){S.nav=false;f.side='grid';f.i=loc.i;render();if(select)press('Enter');return}
  if(loc.kind==='cat'){S.nav=false;f.side='cat';f.cat=loc.i;f.i=0;render();return}
  if(loc.kind==='nav'){S.nav=true;S.navIdx=loc.i;render();if(select)press('Enter');return}
  if(loc.kind==='ep'){f.area='eps';const first=stage.querySelector('.ep .th')?.textContent;f.ep=(+first||1)+loc.i;render();if(select)press('Enter');return}
  if(loc.kind==='seas'){f.area='season';const s=SERIES.find(x=>x.id===S.params.id);f.season=s.seasons[loc.i].n;f.ep=1;render();return}
  if(loc.kind==='mrow'){S.player.miniIdx=loc.i;SCREENS.player.render();if(select)press('Enter');return}
  if(loc.kind==='btn'){if(f.area!==undefined)f.area='btn';f.row=null;f.b=loc.i;render();if(select)press('Enter');return}
}
let lastHover=null;
document.getElementById('tv').addEventListener('mousemove',e=>{const loc=locate(e.target);if(!loc)return;const key=JSON.stringify(loc);if(key===lastHover)return;lastHover=key;if(loc.kind==='row'||loc.kind==='grid'||loc.kind==='nav'||loc.kind==='ep'||loc.kind==='mrow')applyPointer(loc,false);});
document.getElementById('tv').addEventListener('click',e=>{if(e.target.closest('.dpad'))return;const loc=locate(e.target);if(loc){applyPointer(loc,true);return}
  if(S.screen==='player'){press('Enter');}
});
// horizontal wheel / swipe inside a row
document.getElementById('tv').addEventListener('wheel',e=>{if(S.screen==='home'||S.screen==='movies'||S.screen==='series'||S.screen==='mylist'){if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){press(e.deltaX>0?'ArrowRight':'ArrowLeft')}else{press(e.deltaY>0?'ArrowDown':'ArrowUp')}}},{passive:true});
let tx=0,ty=0;document.getElementById('tv').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.getElementById('tv').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dx)>Math.abs(dy))press(dx>0?'ArrowRight':'ArrowLeft');else press(dy>0?'ArrowUp':'ArrowDown')});
// scale to viewport
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);const tv=document.getElementById('tv');tv.style.transform='none';tv.style.zoom=s;}
document.body.tabIndex=0;document.addEventListener('mousedown',()=>document.body.focus());window.addEventListener('load',()=>document.body.focus());
window.addEventListener('wheel',e=>e.preventDefault(),{passive:false});window.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('resize',fit);fit();
// live clock for progress bars
setInterval(()=>{NOW.setTime(Date.now());if(S.screen==='home'||S.screen==='live'||S.screen==='guide')render()},60000);
render();
</script>
